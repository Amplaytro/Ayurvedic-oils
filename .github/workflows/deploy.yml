name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage static site
        run: |
          # Pages publishes whatever we upload. Copy the site into _site,
          # excluding server-side source, dotfiles (.env, .git) and
          # node_modules, so nothing server-side is ever published.
          mkdir -p _site
          tar -cf - \
            --exclude='./server' \
            --exclude='./.git' \
            --exclude='./.gitignore' \
            --exclude='./.gitattributes' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            . | tar -xf - -C _site
          echo "Staged files:"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5